<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fluffy Inventory</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Redirects a deep-link 404 (e.g. /fluffyinv/sales) back to the real
      // index.html with the intended path encoded in a query string, so
      // React Router can pick it up once the app loads.
      var pathSegmentsToKeep = 1; // keep "/fluffyinv"

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
